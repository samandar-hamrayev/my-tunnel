[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mytunnel"
dynamic = ["version"]
description = "Self-hosted ngrok-style HTTP tunnel: FastAPI relay + async CLI client over a single multiplexed WebSocket."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Samandar Hamrayev" }]
requires-python = ">=3.12"
keywords = ["tunnel", "ngrok", "websocket", "reverse-proxy", "fastapi", "asyncio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: Proxy Servers",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=14",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "pytest-timeout>=2.3",
    "ruff>=0.17",
]

[project.scripts]
mytunnel = "mytunnel.cli:app"

[project.urls]
Homepage = "https://github.com/samandar-hamrayev/my-tunnel"
Issues = "https://github.com/samandar-hamrayev/my-tunnel/issues"

[tool.hatch.version]
path = "src/mytunnel/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mytunnel"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "BLE", "A", "C4", "SIM", "RET",
    "PT", "ASYNC", "RUF", "PLE", "PLW", "TRY", "PERF",
]
ignore = [
    "TRY003",   # long messages in exception constructors are fine here
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
timeout = 30
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["mytunnel"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError"]
